<!DOCTYPE html>
<html lang="en" class="bg-slate-50">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galon Management System</title>
    <link rel="stylesheet" href="./src/output.css" />
  </head>

  <body class="min-h-screen font">
    <!-- Header -->
    <nav class="sticky top-0 z-50  bg-white/80 backdrop-blur-md border-b-2 border-blue-700 shadow-lg transition-all">
      <div class="container mx-auto px-6 py-4">
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 flex items-center justify-center text-white">
            <img src="./src/logoAqua/Asset 1.png" alt="" srcset="">
          </div>
          <div>
            <h1 class="text-xl md:text-2xl font-bold text-slate-800 tracking-tight">
              Galon Management System
            </h1>
            <p class="text-sm text-slate-500 font-medium">Inventory & Transaction Management</p>
          </div>
        </div>
      </div>
    </nav>

    <div class="container mx-auto px-6 py-8">
      <!-- Alert -->
      <div id="alert" class="mb-6"></div>

      <!-- Tabs -->
      <div class="bg-white border border-slate-200 mb-6">
        <div class="flex border-b-2 border-slate-200">
          <button
            onclick="switchTab('products')"
            class="tab-btn flex-1 py-4 px-6 font-semibold text-slate-200 bg-blue-600 border border-slate-200"
          >
            Products
          </button>
          <button
            onclick="switchTab('transactions')"
            class="tab-btn flex-1 py-4 px-6 font-semibold text-slate-700 hover:bg-slate-50"
          >
            Transactions
          </button>
        </div>

        <!-- Products Section -->
        <section id="products" class="section md:p-6">
          <h2 class="text-xl font-bold text-black mb-6 pb-3 capitalize">
            manajemen produk
          </h2>
          <div class="flex w-full gap-2 flex-col md:flex-row p-2">
            <!-- Product Form -->
            <form
              id="productForm"
              onsubmit="saveProduct(event)"
              class="bg-slate-50 border border-slate-200 rounded-md p-6 w-full md:w-1/2 mb-8"
            >
              <input type="hidden" id="productId" />

              <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                <div>
                  <label class="block text-sm font-semibold text-black mb-2"
                    >nama produk</label
                  >
                  <input
                    type="text"
                    id="productName"
                    required
                    class="w-full px-4 py-2 border rounded-md border-slate-300 focus:border-blue-600 focus:outline-none"
                  />
                </div>

                <div>
                  <label class="block text-sm font-semibold text-black mb-2"
                    >harga (Rp)</label
                  >
                  <input
                    type="number"
                    id="productPrice"
                    required
                    class="w-full px-4 py-2 border rounded-md border-slate-300 focus:border-blue-600 focus:outline-none"
                  />
                </div>

                <div>
                  <label class="block text-sm font-semibold text-black mb-2"
                    >stok</label
                  >
                  <input
                    type="number"
                    id="productStock"
                    required
                    min="0"
                    value="0"
                    class="w-full px-4 py-2 border rounded-md border-slate-300 focus:border-blue-600 focus:outline-none"
                  />
                </div>
              </div>

              <div
                class="mb-6 flex gap-3 flex-col text-left justify-center items-center"
              >
                <label class="block text-sm font-semibold text-black mb-2"
                  >Product Image</label
                >
                <div
                  id="dropzone"
                  class="relative border border-dashed border-slate-700 rounded-lg cursor-pointer group"
                >
                  <input
                    type="file"
                    id="productImage"
                    accept="image/*"
                    class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"
                  />
                  <div
                    class="flex flex-col items-center justify-center py-12 px-6"
                  >
                    <svg
                      class="w-10 h-10 text-slate-400 group-hover:text-blue-500 hover:animate-pulse transition-colors mb-4"
                      fill="none"
                      stroke="currentColor"
                      viewBox="0 0 24 24"
                    >
                      <path
                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"
                        d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
                      ></path>
                    </svg>
                    <p
                      class="text-lg font-semibold text-center text-slate-700 group-hover:text-blue-600 mb-2"
                    >
                      Drop your image here or click to browse
                    </p>
                    <p class="text-sm text-slate-500">
                      PNG, JPG, GIF up to 10MB
                    </p>
                  </div>
                </div>
                <img
                  id="imagePreview"
                  class="mt-4 w-32 h-32 hidden object-contain border border-dashed border-slate-300"
                  alt="Image Preview"
                />
              </div>

              <div class="flex gap-3 items-start">
                <button
                  type="submit"
                  id="productSubmitBtn"
                  class="bg-blue-600 rounded-md text-white text-sm font-semibold py-3 px-8 hover:bg-blue-700"
                >
                  Add Product
                </button>
                <button
                  type="button"
                  onclick="resetProductForm()"
                  class="bg-slate-600 rounded-md text-white text-sm font-semibold py-3 px-8 hover:bg-slate-700"
                >
                  Cancel
                </button>
              </div>
            </form>

            <!-- Products Table -->
            <div
              class="border rounded-md border-slate-400 w-full overflow-hidden"
            >
              <table class="w-full">
                <thead class="bg-slate-200 text-slate-900">
                  <tr>
                    <th class="px-4 py-3 text-left text-sm font-semibold">
                      ID
                    </th>
                    <th class="px-6 py-6 text-left text-sm font-semibold">
                      Name
                    </th>
                    <th class="px-6 py-6 text-left text-sm font-semibold">
                      Price
                    </th>
                    <th class="px-4 py-3 text-left text-sm font-semibold">
                      Stock
                    </th>
                    <th class="px-4 py-3 text-left text-sm font-semibold">
                      Actions
                    </th>
                  </tr>
                </thead>
                <tbody
                  id="productsTable"
                  class="divide-y-2 divide-slate-200"
                ></tbody>
              </table>
            </div>
          </div>
        </section>

        <!-- Transactions Section -->
         <!-- 
        TODOS : MAKE THE LAYOUT BETTER
         -->
        <section id="transactions" class="section hidden p-6">
          <h2
            class="text-xl font-bold text-black mb-6 pb-3 border-b-2 border-slate-200"
          >
            Transaction Management
          </h2>

          <!-- Total Revenue -->
          <div
            class="rounded-md bg-linear-65 from-blue-600 to-cyan-800 text-white p-6 mb-8"
          >
            <p class="text-sm font-semibold mb-2">TOTAL:</p>
            <p class="text-4xl font-bold" id="totalRevenue">Rp 0</p>
          </div>
          <div class="flex flex-col md:flex-row  gap-2 md:p-2">
            <!-- Transaction Form -->
            <form
              id="transactionForm"
              onsubmit="saveTransaction(event)"
              class="bg-slate-50 border rounded-md border-slate-200 p-6 mb-8"
            >
              <input type="hidden" id="transactionId" />

              <div class="grid grid-cols-1  md:grid-cols-1 gap-4 mb-6">
                <div>
                  <label class="block text-sm font-semibold text-black mb-2"
                    >Product</label
                  >
                  <select
                    id="transactionProduct"
                    required
                    class="w-full px-4 py-2 border border-slate-300 focus:border-blue-600 focus:outline-none"
                  >
                    <option value="">-- Select Product --</option>
                  </select>
                </div>

                <div>
                  <label class="block text-sm font-semibold text-black mb-2"
                    >Quantity</label
                  >
                  <input
                    type="number"
                    id="transactionQuantity"
                    required
                    min="1"
                    class="w-full px-4 py-2 border border-slate-300 focus:border-blue-600 focus:outline-none"
                  />
                </div>
              </div>

              <div class="flex gap-3">
                <button
                  type="submit"
                  id="transactionSubmitBtn"
                  class="bg-blue-600 text-white text-sm rounded-md font-semibold py-3 px-8 hover:bg-blue-700"
                >
                  Add Transaction
                </button>
                <button
                  type="button"
                  onclick="resetTransactionForm()"
                  class="bg-slate-600 text-white text-sm rounded-md font-semibold py-3 px-8 hover:bg-slate-700"
                >
                  Cancel
                </button>
              </div>
            </form>

            <!-- Transactions Table -->
            <div class="border w-full border-slate-200 overflow-hidden rounded-md">
              <table class="w-full">
                <thead class="bg-slate-900 text-white">
                  <tr>
                    <th class="px-4 py-3 text-left text-sm font-semibold">
                      ID
                    </th>
                    <th class="px-4 py-3 text-left text-sm font-semibold">
                      Product
                    </th>
                    <th class="px-4 py-3 text-left text-sm font-semibold">
                      Qty
                    </th>
                    <th class="px-4 py-3 text-left text-sm font-semibold">
                      Price
                    </th>
                    <th class="px-4 py-3 text-left text-sm font-semibold">
                      Total
                    </th>
                    <th class="px-4 py-3 text-left text-sm font-semibold">
                      Actions
                    </th>
                  </tr>
                </thead>
                <tbody
                  id="transactionsTable"
                  class="divide-y-2 divide-slate-200"
                ></tbody>
              </table>
            </div>
          </div>
        </section>
      </div>
    </div>

    <script src="javascript/main.js"></script>
  </body>
</html>
