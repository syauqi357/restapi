<!DOCTYPE html>
<html lang="en" class="bg-gray-50">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Galon Management System</title>
    <link rel="stylesheet" href="./src/output.css" />
  </head>

  <body class="min-h-screen">
    <!-- Header -->
    <header class="backdrop-blur-md border border-blue-600">
      <div class="container mx-auto px-6 py-6">
        <div class="flex items-center gap-4">
          <div class="w-12 h-12 bg-blue-600 flex items-center justify-center">
            <svg fill="#ffffff" height="32px" width="32px" viewBox="0 0 476.801 476.801">
              <path d="M363.526,415.046V230.763c3.324-0.971,5.754-4.037,5.754-7.674c0-19.841-10.646-38.376-27.783-48.372l-39.828-23.231 c-10.404-6.069-16.868-17.323-16.868-29.369v-17.399h0.04c4.418,0,8-3.582,8-8V22.513C292.841,10.1,282.741,0,270.328,0h-63.855 C194.06,0,183.96,10.1,183.96,22.513v74.204c0,4.418,3.582,8,8,8H192v17.399c0,12.046-6.464,23.3-16.869,29.369l-39.827,23.231 c-17.137,9.996-27.783,28.531-27.783,48.372c0,3.637,2.43,6.703,5.754,7.674v184.283c-3.324,0.971-5.754,4.037-5.754,7.674v10.08 c0,24.262,19.738,44,44,44h173.76c24.262,0,44-19.738,44-44v-10.08C369.28,419.083,366.85,416.018,363.526,415.046z M199.96,88.717 V71.729h76.881v16.987h-0.04H200H199.96z M206.473,16h63.855c3.591,0,6.513,2.922,6.513,6.513v33.217H199.96V22.513 C199.96,18.922,202.882,16,206.473,16z M143.366,188.537l39.826-23.231C198.494,156.381,208,139.831,208,122.116v-17.399h60.801 v17.399c0,17.715,9.506,34.265,24.807,43.189l39.827,23.231c9.898,5.773,16.765,15.534,19.03,26.552h-11.664c-4.418,0-8,3.582-8,8 s3.582,8,8,8h6.726V273.5c-6.065-0.643-9.817-2.249-13.997-4.048c-6.155-2.648-13.132-5.651-26.397-5.651 s-20.242,3.003-26.397,5.651c-5.421,2.334-10.103,4.349-20.071,4.349c-9.967,0-14.648-2.015-20.068-4.349 c-6.154-2.648-13.13-5.651-26.395-5.651s-20.241,3.003-26.396,5.652c-5.42,2.333-10.102,4.348-20.068,4.348 s-14.648-2.015-20.068-4.349c-4.778-2.056-10.066-4.32-18.394-5.232v-33.131h160.326c4.418,0,8-3.582,8-8s-3.582-8-8-8H124.336 C126.602,204.071,133.468,194.311,143.366,188.537z M353.28,432.801c0,15.439-12.561,28-28,28h-173.76c-15.439,0-28-12.561-28-28 v-2.08h166.08c4.418,0,8-3.582,8-8s-3.582-8-8-8H129.274V280.343c4.974,0.753,8.347,2.204,12.067,3.806 c6.154,2.649,13.13,5.652,26.395,5.652s20.24-3.003,26.395-5.651c5.42-2.334,10.102-4.349,20.069-4.349 c9.967,0,14.648,2.015,20.068,4.349c6.154,2.648,13.13,5.651,26.395,5.651c13.266,0,20.242-3.003,26.397-5.651 c5.421-2.334,10.103-4.349,20.071-4.349s14.65,2.015,20.071,4.349c5.138,2.21,10.862,4.662,20.323,5.414v125.158h-6.726 c-4.418,0-8,3.582-8,8s3.582,8,8,8h12.479V432.801z"></path>
            </svg>
          </div>
          <div>
            <h1 class="text-2xl font-bold text-black">Galon Management System</h1>
            <p class="text-sm text-black">Inventory & Transaction Management</p>
          </div>
        </div>
      </div>
    </header>

    <div class="container mx-auto px-6 py-8">
      <!-- Alert -->
      <div id="alert" class="mb-6"></div>

      <!-- Tabs -->
      <div class="bg-white border-2 border-gray-200 mb-6">
        <div class="flex border-b-2 border-gray-200">
          <button
            onclick="switchTab('products')"
            class="tab-btn flex-1 py-4 px-6 font-semibold text-gray-700 bg-blue-600 text-white border-r-2 border-gray-200"
          >
            Products
          </button>
          <button
            onclick="switchTab('transactions')"
            class="tab-btn flex-1 py-4 px-6 font-semibold text-gray-700 hover:bg-gray-50"
          >
            Transactions
          </button>
        </div>

        <!-- Products Section -->
        <div id="products" class="section p-6">
          <h2 class="text-xl font-bold text-black mb-6 pb-3 border-b-2 border-gray-200">Product Management</h2>

          <!-- Product Form -->
          <form id="productForm" onsubmit="saveProduct(event)" class="bg-gray-50 border-2 border-gray-200 p-6 mb-8">
            <input type="hidden" id="productId" />
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-4">
              <div>
                <label class="block text-sm font-semibold text-black mb-2">Product Name</label>
                <input type="text" id="productName" required class="w-full px-4 py-2 border-2 border-gray-300 focus:border-blue-600 focus:outline-none" />
              </div>
              
              <div>
                <label class="block text-sm font-semibold text-black mb-2">Price (Rp)</label>
                <input type="number" id="productPrice" required class="w-full px-4 py-2 border-2 border-gray-300 focus:border-blue-600 focus:outline-none" />
              </div>
              
              <div>
                <label class="block text-sm font-semibold text-black mb-2">Stock</label>
                <input type="number" id="productStock" required min="0" value="0" class="w-full px-4 py-2 border-2 border-gray-300 focus:border-blue-600 focus:outline-none" />
              </div>
            </div>

            <div class="mb-6 bg-blue-500">
              <label class="block text-sm font-semibold text-black mb-2">Product Image</label>
              <div id="dropzone" class="relative border-2 border-dashed border-slate-700 bg-blue-500 cursor-pointer group">
                <input type="file" id="productImage" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-10"/>
                <div class="flex flex-col items-center justify-center py-12 px-6">
                  <svg class="w-10 h-10 text-gray-400 group-hover:text-blue-500 transition-colors mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path>
                  </svg>
                  <p class="text-lg font-semibold text-gray-700 group-hover:text-blue-600 mb-2">Drop your image here or click to browse</p>
                  <p class="text-sm text-gray-500">PNG, JPG, GIF up to 10MB</p>
                </div>
              </div>
              <img id="imagePreview" class="mt-4 w-32 h-32 object-cover border-2 border-gray-300 hidden" alt="Image Preview" />
            </div>

            <div class="flex gap-3">
              <button type="submit" id="productSubmitBtn" class="bg-blue-600 text-white font-semibold py-3 px-8 hover:bg-blue-700">
                Add Product
              </button>
              <button type="button" onclick="resetProductForm()" class="bg-gray-600 text-white font-semibold py-3 px-8 hover:bg-gray-700">
                Cancel
              </button>
            </div>
          </form>

          <!-- Products Table -->
          <div class="border-2 border-gray-200 overflow-hidden">
            <table class="w-full">
              <thead class="bg-gray-900 text-white">
                <tr>
                  <th class="px-4 py-3 text-left text-sm font-semibold">ID</th>
                  <th class="px-4 py-3 text-left text-sm font-semibold">Name</th>
                  <th class="px-4 py-3 text-left text-sm font-semibold">Price</th>
                  <th class="px-4 py-3 text-left text-sm font-semibold">Stock</th>
                  <th class="px-4 py-3 text-left text-sm font-semibold">Actions</th>
                </tr>
              </thead>
              <tbody id="productsTable" class="divide-y-2 divide-gray-200"></tbody>
            </table>
          </div>
        </div>

        <!-- Transactions Section -->
        <div id="transactions" class="section hidden p-6">
          <h2 class="text-xl font-bold text-black mb-6 pb-3 border-b-2 border-gray-200">Transaction Management</h2>

          <!-- Total Revenue -->
          <div class="bg-blue-600 text-white p-6 mb-8 border-2 border-blue-700">
            <p class="text-sm font-semibold mb-2">TOTAL REVENUE</p>
            <p class="text-4xl font-bold" id="totalRevenue">Rp 0</p>
          </div>

          <!-- Transaction Form -->
          <form id="transactionForm" onsubmit="saveTransaction(event)" class="bg-gray-50 border-2 border-gray-200 p-6 mb-8">
            <input type="hidden" id="transactionId" />
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
              <div>
                <label class="block text-sm font-semibold text-black mb-2">Product</label>
                <select id="transactionProduct" required class="w-full px-4 py-2 border-2 border-gray-300 focus:border-blue-600 focus:outline-none">
                  <option value="">-- Select Product --</option>
                </select>
              </div>
              
              <div>
                <label class="block text-sm font-semibold text-black mb-2">Quantity</label>
                <input type="number" id="transactionQuantity" required min="1" class="w-full px-4 py-2 border-2 border-gray-300 focus:border-blue-600 focus:outline-none" />
              </div>
            </div>

            <div class="flex gap-3">
              <button type="submit" id="transactionSubmitBtn" class="bg-blue-600 text-white font-semibold py-3 px-8 hover:bg-blue-700">
                Add Transaction
              </button>
              <button type="button" onclick="resetTransactionForm()" class="bg-gray-600 text-white font-semibold py-3 px-8 hover:bg-gray-700">
                Cancel
              </button>
            </div>
          </form>

          <!-- Transactions Table -->
          <div class="border-2 border-gray-200 overflow-hidden">
            <table class="w-full">
              <thead class="bg-gray-900 text-white">
                <tr>
                  <th class="px-4 py-3 text-left text-sm font-semibold">ID</th>
                  <th class="px-4 py-3 text-left text-sm font-semibold">Product</th>
                  <th class="px-4 py-3 text-left text-sm font-semibold">Qty</th>
                  <th class="px-4 py-3 text-left text-sm font-semibold">Price</th>
                  <th class="px-4 py-3 text-left text-sm font-semibold">Total</th>
                  <th class="px-4 py-3 text-left text-sm font-semibold">Actions</th>
                </tr>
              </thead>
              <tbody id="transactionsTable" class="divide-y-2 divide-gray-200"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <script src="javascript/main.js"></script>
  </body>
</html>
